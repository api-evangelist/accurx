name: Accurx
kind: company
description: >-
  Accurx is a United Kingdom clinical communication and workflow company, founded in
  2016 and headquartered in London, whose software is used across NHS primary care,
  secondary care, and community and mental health services to message patients, run
  patient triage, batch-message cohorts, book and remind appointments, and (via its
  Scribe product) draft clinical notes with AI. Accurx integrates around the NHS as an
  assured IM1 live supplier, using NHS Digital's interoperability standards for primary
  care and connecting bi-directionally to the GP clinical-system duopoly (EMIS Health,
  TPP SystmOne) and Vision, plus NHS national services including the Personal
  Demographics Service (PDS), NHS Single Sign-On, NHS Login, and the NHS App. Accurx
  is a consumer and integrator of NHS FHIR and IM1 interfaces rather than a publisher
  of its own public developer API: as of this review it operates no public developer
  portal, no self-serve REST/FHIR API, and no downloadable OpenAPI or FHIR
  CapabilityStatement. Third-party and trust integrations are arranged through its
  partnerships and integration teams under partner agreement.
